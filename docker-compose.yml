name: minicambio

# Configuração comum às três APIs .NET.
x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Development
  Database__ApplyMigrationsOnStartup: "true"

# Healthcheck comum aos três Postgres. -h localhost força TCP: durante a inicialização o Postgres sobe um
# servidor temporário só no socket local, e o check não deve dar "pronto" antes do servidor definitivo.
x-db-healthcheck: &db-healthcheck
  test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

# Healthcheck comum às APIs: GET /health/ready (inclui o banco). A imagem aspnet não tem curl/wget,
# então a requisição HTTP é feita com o /dev/tcp do bash.
x-api-healthcheck: &api-healthcheck
  test:
    - CMD
    - bash
    - -c
    - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  # ---------------------------------------------------------------- bancos
  rates-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rates
      POSTGRES_USER: ${RATES_DB_USER:?defina RATES_DB_USER no .env}
      POSTGRES_PASSWORD: ${RATES_DB_PASSWORD:?defina RATES_DB_PASSWORD no .env}
    ports:
      - "5433:5432" # apenas para inspeção local
    volumes:
      - rates-db-data:/var/lib/postgresql/data
    healthcheck: *db-healthcheck
    networks: [rates-net]

  payments-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: ${PAYMENTS_DB_USER:?defina PAYMENTS_DB_USER no .env}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:?defina PAYMENTS_DB_PASSWORD no .env}
    ports:
      - "5434:5432" # apenas para inspeção local
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck: *db-healthcheck
    networks: [payments-net]

  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${ORDERS_DB_USER:?defina ORDERS_DB_USER no .env}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?defina ORDERS_DB_PASSWORD no .env}
    ports:
      - "5435:5432" # apenas para inspeção local
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck: *db-healthcheck
    networks: [orders-net]

  # ---------------------------------------------------------------- cache
  # Redis do Rates: guarda a taxa ao vivo de cada moeda por 5 min (Rates__LiveRateCacheSeconds), compartilhada por
  # todas as réplicas. Só memória: sem volume e com a persistência desligada (--save "" e --appendonly no), porque
  # cache se reconstrói sozinho. --maxmemory + allkeys-lru: no limite, o Redis descarta as chaves menos usadas.
  rates-cache:
    image: redis:8.10-alpine
    command:
      - redis-server
      - --requirepass
      - ${RATES_CACHE_PASSWORD:?defina RATES_CACHE_PASSWORD no .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDISCLI_AUTH: ${RATES_CACHE_PASSWORD} # o redis-cli lê a senha daqui (healthcheck e docker compose exec)
    ports:
      - "6379:6379" # apenas para inspeção local e dotnet run
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rates-net]

  # ---------------------------------------------------------------- mensageria
  # Kafka em modo KRaft (sem ZooKeeper): um único processo é broker (guarda as mensagens) e controller (guarda os
  # metadados do cluster). Um nó só, então todo fator de replicação é 1.
  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # id fixo do cluster (gerado com kafka-storage.sh random-uuid)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Três portas: INTERNAL para os containers (kafka:9092), EXTERNAL para o host (localhost:9094, usada pelo
      # dotnet run) e CONTROLLER, só do próprio Kafka.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # os tópicos são criados pelo kafka-topics, abaixo
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - "9094:9094" # apenas para rodar uma API com dotnet run fora do compose
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks: [backend]

  # Roda uma vez e termina: cria os dois tópicos (3 partições cada). --if-not-exists torna a execução repetível.
  kafka-topics:
    image: apache/kafka:4.3.2
    command:
      - bash
      - -c
      - |
        set -e
        for topic in minicambio.payment-requests minicambio.payment-results; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
    depends_on:
      kafka:
        condition: service_healthy
    networks: [backend]

  # ---------------------------------------------------------------- APIs
  rates-api:
    build: ../minicambio-rates
    environment:
      <<: *api-environment
      ConnectionStrings__Default: Host=rates-db;Port=5432;Database=rates;Username=${RATES_DB_USER};Password=${RATES_DB_PASSWORD}
      ConnectionStrings__Redis: rates-cache:6379,password=${RATES_CACHE_PASSWORD}
    ports:
      - "5001:8080"
    depends_on:
      rates-db:
        condition: service_healthy
      rates-cache:
        condition: service_started # não espera o healthy: sem o Redis a API funciona, só que sem cache
    healthcheck: *api-healthcheck
    networks: [rates-net, backend]

  payments-api:
    build: ../minicambio-payments
    environment:
      <<: *api-environment
      ConnectionStrings__Default: Host=payments-db;Port=5432;Database=payments;Username=${PAYMENTS_DB_USER};Password=${PAYMENTS_DB_PASSWORD}
      Kafka__BootstrapServers: kafka:9092
    ports:
      - "5002:8080"
    depends_on:
      payments-db:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    networks: [payments-net, backend]

  orders-api:
    build: ../minicambio-orders
    environment:
      <<: *api-environment
      ConnectionStrings__Default: Host=orders-db;Port=5432;Database=orders;Username=${ORDERS_DB_USER};Password=${ORDERS_DB_PASSWORD}
      Services__RatesApi: http://rates-api:8080
      Kafka__BootstrapServers: kafka:9092 # com o Payments a conversa é pelo Kafka, não mais por HTTP
    ports:
      - "5000:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      rates-api:
        condition: service_started
      kafka-topics:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck
    networks: [orders-net, backend, frontend]

  # ---------------------------------------------------------------- frontend
  web:
    build: ../minicambio-web
    environment:
      ORDERS_API_URL: http://orders-api:8080
    ports:
      - "3000:8080"
    depends_on:
      - orders-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [frontend]

# Cada banco (e o Redis do Rates) só é visível para a sua API; as APIs e o Kafka ficam na "backend" (Orders → Rates por HTTP,
# Orders ↔ Payments pelo Kafka); o web só enxerga o orders-api pela "frontend".
networks:
  rates-net:
  payments-net:
  orders-net:
  backend:
  frontend:

volumes:
  rates-db-data:
  payments-db-data:
  orders-db-data:
  kafka-data:
