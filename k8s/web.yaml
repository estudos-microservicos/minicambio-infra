# Passo 10: o frontend (equivalente ao serviço web do docker-compose.yml).
# - Deployment: nginx com o build do React; encaminha /api para o Service "orders-api" (ORDERS_API_URL).
# - Service ClusterIP (Passo 17.3; até o 17.2 era LoadBalancer em localhost:3000, como o ports: "3000:8080" do
#   compose): só é acessível de dentro do cluster. Quem vem de fora entra pelo Ingress (k8s/ingress.yaml), em
#   http://localhost, e o Ingress Controller encaminha para este Service na porta 3000.
# - Probes (Passo 13.2): readiness e liveness no /healthz do nginx, que responde 200 sem depender do Orders.
# - Réplicas (Passo 14): 3 Pods de nginx, que não guardam estado; o Service divide o tráfego entre eles.
# Ainda provisório: a imagem só existe no Docker local (imagePullPolicy: Never).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: minicambio
spec:
  replicas: 3 # nginx não guarda estado, então qualquer Pod atende qualquer requisição
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: minicambio-web:latest
          imagePullPolicy: Never # usa só a imagem do Docker local; nunca tenta baixar de um registry
          env:
            - name: ORDERS_API_URL
              value: http://orders-api:8080 # nome do Service do Orders
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: minicambio
spec:
  type: ClusterIP # o padrão; escrito para deixar clara a troca: a entrada de fora agora é o Ingress
  selector:
    app: web
  ports:
    - port: 3000 # porta do Service dentro do cluster; é a que o Ingress cita em backend.service.port
      targetPort: 8080 # porta do nginx no container
