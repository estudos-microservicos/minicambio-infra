# Passo 10: o frontend (equivalente ao serviço web do docker-compose.yml).
# - Deployment: nginx com o build do React; encaminha /api para o Service "orders-api" (ORDERS_API_URL).
# - Service do tipo LoadBalancer: abre o acesso de fora do cluster. No Docker Desktop ele publica em
#   localhost:3000, como o ports: "3000:8080" do compose; numa nuvem criaria um balanceador com IP público.
# - Probes (Passo 13.2): readiness e liveness no /healthz do nginx, que responde 200 sem depender do Orders.
# - Réplicas (Passo 14): 3 Pods de nginx, que não guardam estado; o LoadBalancer divide o localhost:3000 entre eles.
# Ainda provisório: a imagem só existe no Docker local (imagePullPolicy: Never).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: minicambio
spec:
  replicas: 3 # nginx não guarda estado, então qualquer Pod atende qualquer requisição
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: minicambio-web:latest
          imagePullPolicy: Never # usa só a imagem do Docker local; nunca tenta baixar de um registry
          env:
            - name: ORDERS_API_URL
              value: http://orders-api:8080 # nome do Service do Orders
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: minicambio
spec:
  type: LoadBalancer # o padrão (ClusterIP) só é acessível de dentro do cluster
  selector:
    app: web
  ports:
    - port: 3000 # porta acessível de fora: http://localhost:3000
      targetPort: 8080 # porta do nginx no container
