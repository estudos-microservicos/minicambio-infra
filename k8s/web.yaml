# Passo 10: o frontend (equivalente ao serviço web do docker-compose.yml).
# - Deployment: nginx com o build do React; encaminha /api para o Service "orders-api" (ORDERS_API_URL).
# - Service ClusterIP (Passo 17.3; até o 17.2 era LoadBalancer em localhost:3000, como o ports: "3000:8080" do
#   compose): só é acessível de dentro do cluster. Quem vem de fora entra pelo Ingress (k8s/ingress.yaml), em
#   http://localhost, e o Ingress Controller encaminha para este Service na porta 3000.
# - Probes (Passo 13.2): readiness e liveness no /healthz do nginx, que responde 200 sem depender do Orders.
# - Réplicas (Passo 14): 3 Pods de nginx, que não guardam estado; o Service divide o tráfego entre eles.
# - ConfigMap (Passo 20): o ORDERS_API_URL saiu do "env" para o ConfigMap "web" (fim do arquivo), lido via envFrom.
# - Autoscaling (Passo 23.7): o número de Pods saiu do Deployment (sem "replicas") e passou para o HPA "web" (fim
#   do arquivo): de 1 a 3 Pods, conforme a CPU.
# Ainda provisório: a imagem só existe no Docker local (imagePullPolicy: Never).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: minicambio
spec:
  # sem "replicas": quem decide é o HPA (fim do arquivo). Como o nginx não guarda estado, qualquer Pod atende
  # qualquer requisição, e o HPA pode tirar e pôr Pods sem cuidado especial
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: minicambio-web:latest
          imagePullPolicy: Never # usa só a imagem do Docker local; nunca tenta baixar de um registry
          envFrom: # cada chave do ConfigMap vira uma variável de ambiente com o mesmo nome
            - configMapRef:
                name: web
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: minicambio
spec:
  type: ClusterIP # o padrão; escrito para deixar clara a troca: a entrada de fora agora é o Ingress
  selector:
    app: web
  ports:
    - port: 3000 # porta do Service dentro do cluster; é a que o Ingress cita em backend.service.port
      targetPort: 8080 # porta do nginx no container
---
apiVersion: v1
kind: ConfigMap # o "environment:" do compose, fora do Deployment; o Pod só lê os valores ao subir
metadata:
  name: web
  namespace: minicambio
data:
  ORDERS_API_URL: http://orders-api:8080 # nome do Service do Orders
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler # mesmo padrão do rates-api.yaml
metadata:
  name: web
  namespace: minicambio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization # porcentagem do requests.cpu do nginx (50m), então 50% = 25m
          averageUtilization: 50
