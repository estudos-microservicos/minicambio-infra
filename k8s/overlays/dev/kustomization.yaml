# Passo 26.3: ambiente DEV (de estudo), no namespace "minicambio-dev", com no máximo 1 Pod por componente.
# - Mesma base do PROD; muda só o que está aqui. Os arquivos da base não são editados.
# - 1 Pod: os bancos, o Kafka e o Redis já têm 1. As APIs e o web não têm "replicas" no Deployment (o HPA
#   cuidava disso, Passo 23); sem o HPA, o Deployment fica no padrão, que é 1. Sem HPA, o PDB do Rates
#   (minAvailable: 1) só travaria o drain, então também sai.
# - Equivalente no compose: um "docker compose -p minicambio-dev -f docker-compose.yml -f docker-compose.dev.yml".
# - Passo 26.4: endereços próprios no Ingress (o ingress-nginx recusa dois Ingress com o mesmo host, mesmo em
#   namespaces diferentes): dev.localhost (site), orders/rates/payments.dev.localhost (APIs). O PowerShell 5.1
#   precisa deles no arquivo hosts do Windows (o navegador e o curl.exe resolvem *.localhost sozinhos).
# Aplicar: kubectl apply -k k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minicambio-dev # troca o namespace de tudo, e o nome do Namespace da base

resources:
  - ../../base
  - resourcequota.yaml # Passo 28.1: cota do DEV (o LimitRange foi para a base no Passo 29.1)
  # Passo 35.2.4: as senhas do DEV, seladas pelo kubeseal (no lugar do secretGenerator do Passo 26.9; ver abaixo).
  - secrets/rates-db.sealed.yaml
  - secrets/payments-db.sealed.yaml
  - secrets/orders-db.sealed.yaml
  - secrets/rates-cache.sealed.yaml

# Passo 34.3: a versão de cada imagem NESTE ambiente. A tag é o SHA curto do commit do repo do serviço
# (git -C ../minicambio-<servico> rev-parse --short HEAD), e a imagem é construída com essa tag.
# - O Kustomize procura pelo NOME da imagem (sem olhar a tag da base, que continua ":latest") em todo lugar onde
#   ela aparece: Deployments e também os Jobs de migração, que usam a imagem da API.
# - Trocar a tag muda o template dos Jobs, que é imutável: apagar os Jobs de migração antes do apply (como no 26.9).
# - Promover uma versão para o PROD = copiar a tag para o overlays/prod. O git diff mostra o que foi para onde.
# - Tags SEMPRE entre aspas: sem elas, o YAML leu 011e061 como número (11 x 10^61) e o Kustomize recusou.
images:
  - name: minicambio-rates-api
    newTag: "053d175" # Passo 35.5.3: volta à versão do PROD só por commit (o Argo CD aplica); será revertido
  - name: minicambio-orders-api
    newTag: "011e061"
  - name: minicambio-payments-api
    newTag: "e875923"
  - name: minicambio-web
    newTag: "1a32893"

# Passo 35.2.4: senhas do DEV (diferentes das do PROD) por Sealed Secrets, em vez do secretGenerator do Passo 26.9.
# - Motivo: o Argo CD só enxerga o Git, e os secrets/*.env ficam fora dele (repo público). O SealedSecret é a senha
#   criptografada com a chave pública do controlador (kube-system); só ele, com a chave privada, cria o Secret.
# - Selado para nome + namespace: o arquivo do DEV não abre no PROD, e vice-versa.
# - Os Secrets passam a ter nome fixo (rates-db, sem hash). Trocar a senha não muda mais o template dos Pods:
#   depois de selar de novo e aplicar, é preciso "kubectl rollout restart" (os Pods só leem o Secret ao subir).
# - Os secrets/*.env seguem fora do git, agora só como entrada do kubeseal (modelos: secrets/*.env.example).
#   Selar (a senha aberta não vai ao disco; -w grava o arquivo sem passar pelo ">" do PowerShell):
#   kubectl create secret generic <nome> -n minicambio-dev --from-env-file=k8s/overlays/dev/secrets/<nome>.env `
#     --dry-run=client -o yaml | kubeseal --format yaml -w k8s/overlays/dev/secrets/<nome>.sealed.yaml

patches:
  # Passo 30.3: todos os Deployments do DEV usam a PriorityClass minicambio-dev (-100, nunca remove ninguém).
  # Mesmo patch do overlays/prod, só muda a classe (ver lá).
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: qualquer
      spec:
        template:
          spec:
            priorityClassName: minicambio-dev
  # "$patch: delete" é um patch que, em vez de mudar campos, remove o recurso inteiro do resultado.
  # O "target" escolhe a quem ele se aplica: todos os HPAs, qualquer que seja o nome.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: qualquer # ignorado: quem decide o alvo é o "target" acima
  - target:
      kind: PodDisruptionBudget
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: qualquer
  # Passo 26.4: JSON Patch (RFC 6902), uma lista de operações sobre caminhos do YAML. Serve aqui porque
  # "rules" é uma lista sem chave de mescla: um patch comum (como os de cima) trocaria a lista inteira.
  # O caminho usa a posição na lista (0 = primeira regra), então cada troca vem depois de um "test", que
  # confere o valor atual: se alguém reordenar as regras da base, o Kustomize falha em vez de trocar o host errado.
  - target:
      kind: Ingress
      name: minicambio
    patch: |-
      - op: add # a regra 0 (site) não tem host na base; "add" cria o campo
        path: /spec/rules/0/host
        value: dev.localhost
      - op: test
        path: /spec/rules/1/host
        value: orders.localhost
      - op: replace
        path: /spec/rules/1/host
        value: orders.dev.localhost
      - op: test
        path: /spec/rules/2/host
        value: rates.localhost
      - op: replace
        path: /spec/rules/2/host
        value: rates.dev.localhost
      - op: test
        path: /spec/rules/3/host
        value: payments.localhost
      - op: replace
        path: /spec/rules/3/host
        value: payments.dev.localhost
