# Passo 26.2: ambiente PROD (de estudo). É o ambiente que já rodava no namespace "minicambio".
# Por enquanto não muda nada em relação à base: o resultado tem de sair "unchanged" no cluster atual.
# Aplicar: kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Troca o namespace de TODOS os recursos (inclusive o nome do próprio Namespace da base).
# Aqui o valor é igual ao da base; no DEV (26.3) é este campo que separa os ambientes.
namespace: minicambio

resources:
  - ../../base # uma pasta com kustomization.yaml também pode ser um "resource"
  - resourcequota.yaml # Passo 29.2: cota pelo pior caso dos HPAs (no DEV, pelo uso atual)
  - scaledobjects.yaml # Passo 33: Orders e Payments escalados pelo KEDA (LAG do Kafka + CPU)
  # Passo 35.2.5: as senhas do PROD, seladas pelo kubeseal (no lugar do secretGenerator do Passo 26.9; ver abaixo).
  - secrets/rates-db.sealed.yaml
  - secrets/payments-db.sealed.yaml
  - secrets/orders-db.sealed.yaml
  - secrets/rates-cache.sealed.yaml

# Passo 34.4: a versão de cada imagem no PROD (mesmo mecanismo do overlays/dev; ver lá). Promover = copiar para cá
# a tag já testada no DEV. Tags entre aspas; trocar a tag exige apagar os Jobs de migração antes do apply.
images:
  - name: minicambio-rates-api
    newTag: "053d175"
  - name: minicambio-orders-api
    newTag: "011e061"
  - name: minicambio-payments-api
    newTag: "e875923"
  - name: minicambio-web
    newTag: "1a32893"

# Passo 26.7: configuração própria do PROD por cima da gerada na base.
# "behavior: merge" junta estes valores aos do orders-api.env da base (o que repete, troca; o que é novo, entra).
# Production desliga a documentação em /scalar (Program.cs só a publica em Development); o DEV segue com ela.
# O conteúdo muda, então o hash do PROD fica diferente do hash do DEV.
# Passo 26.8: o mesmo nas outras duas APIs.
configMapGenerator:
  - name: orders-api
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
  - name: rates-api
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
  - name: payments-api
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production

# Passo 35.2.5: as senhas do PROD (as mesmas de antes, que já estão gravadas no disco dos bancos), por Sealed
# Secrets, em vez do secretGenerator do Passo 26.9. Mesmo mecanismo do overlays/dev (ver lá): selado para
# nome + namespace, então o arquivo do PROD só abre no namespace "minicambio".
# - Os secrets/*.env seguem fora do git, agora só como entrada do kubeseal (modelos: secrets/*.env.example).
#   Selar: kubectl create secret generic <nome> -n minicambio --from-env-file=k8s/overlays/prod/secrets/<nome>.env `
#     --dry-run=client -o yaml | kubeseal --format yaml -w k8s/overlays/prod/secrets/<nome>.sealed.yaml
# - Nome fixo (sem hash): trocar a senha exige "kubectl rollout restart" depois do apply.
# - Cuidado: o Postgres só lê a senha ao criar o banco. Trocar aqui não troca a senha de um banco existente
#   (exigiria ALTER USER); o Redis lê a cada subida, então nele basta trocar (e reiniciar).

patches:
  # Passo 30.3: todos os Deployments do PROD usam a PriorityClass minicambio-prod (k8s/priorityclasses.yaml).
  # - Patch comum (mescla) com "target": vale para todo Deployment, qualquer que seja o nome; o name abaixo é
  #   ignorado, como nos "$patch: delete" do DEV.
  # - Muda o template: cada Deployment faz um rollout (os bancos e o Kafka, com Recreate, ficam segundos fora).
  # - Os Jobs (migrations, kafka-topics) ficam sem classe: o template do Job é imutável (exigiria delete job).
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: qualquer
      spec:
        template:
          spec:
            priorityClassName: minicambio-prod
