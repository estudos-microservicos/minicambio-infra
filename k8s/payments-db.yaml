# Passo 8: o Postgres do Payments (equivalente ao serviço payments-db do docker-compose.yml).
# Mesmo padrão do rates-db.yaml: Deployment (mantém 1 Pod rodando) + Service (endereço fixo "payments-db").
# Passo 11: a senha vem do Secret "payments-db" (definido em secrets.yaml, fora do git).
# Passo 12: os dados ficam no PersistentVolumeClaim "payments-db-data" (o volume payments-db-data do compose).
# Passo 13.2: probes do tipo exec com pg_isready, como no rates-db.yaml.
# Passo 15.2: NetworkPolicy "payments-db" (a rede payments-net do compose): só o payments-api entra na porta 5432.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-db
  namespace: minicambio
spec:
  replicas: 1
  strategy:
    type: Recreate # derruba o Pod antigo antes de criar o novo: dois Postgres no mesmo disco corrompem os dados
  selector:
    matchLabels:
      app: payments-db
  template:
    metadata:
      labels:
        app: payments-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: payments
            - name: POSTGRES_USER
              value: payments
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-db
                  key: password
            - name: PGDATA # os dados numa subpasta do disco: o Postgres exige uma pasta vazia para inicializar
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe: # mesmas probes do rates-db.yaml
            exec:
              command: ["pg_isready", "-h", "localhost", "-U", "payments", "-d", "payments"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "localhost", "-U", "payments", "-d", "payments"]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: payments-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: payments-db # a API usa Host=payments-db
  namespace: minicambio
spec:
  selector:
    app: payments-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payments-db-data
  namespace: minicambio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-db
  namespace: minicambio
spec:
  podSelector: # a quem a regra se aplica: aos Pods do banco
    matchLabels:
      app: payments-db
  policyTypes:
    - Ingress # regula só o que ENTRA nesses Pods; a partir daqui, entrada não listada abaixo é bloqueada
  ingress:
    - from:
        - podSelector: # quem pode entrar: Pods com esta label, no mesmo namespace
            matchLabels:
              app: payments-api
      ports:
        - port: 5432
