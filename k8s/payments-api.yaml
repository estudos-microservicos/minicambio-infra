# Passo 8: a API do Payments (equivalente ao serviço payments-api do docker-compose.yml).
# Mesmo padrão do rates-api.yaml: Deployment com a imagem do Docker local + Service com o endereço fixo
# "payments-api", que o Orders vai usar (Services__PaymentsApi=http://payments-api:8080).
# Ainda provisório: a senha em texto na connection string (vira Secret); a imagem só existe no Docker local
# (imagePullPolicy: Never); as migrations rodam na subida da API, o que só é seguro com 1 réplica (vira Job ou
# init container); sem probes (o healthcheck do compose vira liveness/readiness).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: minicambio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: minicambio-payments-api:latest
          imagePullPolicy: Never # usa só a imagem do Docker local; nunca tenta baixar de um registry
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development # igual ao compose: habilita a documentação em /scalar
            - name: Database__ApplyMigrationsOnStartup
              value: "true"
            - name: ConnectionStrings__Default
              value: Host=payments-db;Port=5432;Database=payments;Username=payments;Password=provisorio # Host = nome do Service do banco
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: minicambio
spec:
  selector:
    app: payments-api
  ports:
    - port: 8080
      targetPort: 8080
