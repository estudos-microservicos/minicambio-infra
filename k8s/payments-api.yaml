# Passo 8: a API do Payments (equivalente ao serviço payments-api do docker-compose.yml).
# Mesmo padrão do rates-api.yaml: Deployment com a imagem do Docker local + Service com o endereço fixo
# "payments-api", que o Orders vai usar (Services__PaymentsApi=http://payments-api:8080).
# Passo 11: a senha do banco vem do Secret "payments-db" e entra na connection string via $(DB_PASSWORD).
# Ainda provisório: a imagem só existe no Docker local (imagePullPolicy: Never).
# Passo 13: probes de readiness (/health/ready) e liveness (/health/live), como no rates-api.yaml.
# Passo 14: 3 réplicas, como no rates-api.yaml. O worker roda em cada Pod e o SELECT ... FOR UPDATE SKIP LOCKED
# impede que dois Pods processem o mesmo registro.
# Passo 15.3: NetworkPolicy "payments-api" (a rede backend do compose): só o orders-api entra na porta 8080.
# Passo 16.5: migrations fora da API (Database__ApplyMigrationsOnStartup=false), no Job payments-migrations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: minicambio
spec:
  replicas: 3 # o worker roda nas 3; o SKIP LOCKED divide os registros entre elas
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: minicambio-payments-api:latest
          imagePullPolicy: Never # usa só a imagem do Docker local; nunca tenta baixar de um registry
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development # igual ao compose: habilita a documentação em /scalar
            - name: Database__ApplyMigrationsOnStartup # quem migra é o Job payments-migrations; o "false" explícito
              value: "false" # vence o "true" do appsettings.Development.json, que o Development acima carrega
            - name: DB_PASSWORD # tem que vir antes da connection string, que a usa via $(DB_PASSWORD)
              valueFrom:
                secretKeyRef:
                  name: payments-db
                  key: password
            - name: ConnectionStrings__Default # Host = nome do Service do banco
              value: Host=payments-db;Port=5432;Database=payments;Username=payments;Password=$(DB_PASSWORD)
          ports:
            - containerPort: 8080
          readinessProbe: # mesmas probes do rates-api.yaml
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: minicambio
spec:
  selector:
    app: payments-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-api
  namespace: minicambio
spec:
  podSelector: # a quem a regra se aplica: aos Pods desta API
    matchLabels:
      app: payments-api
  policyTypes:
    - Ingress # só o que ENTRA; a saída continua livre (a API ainda alcança o próprio banco e o DNS)
  ingress:
    - from:
        - podSelector: # só o Orders chama o Payments (pagamento ao confirmar)
            matchLabels:
              app: orders-api
      ports:
        - port: 8080
