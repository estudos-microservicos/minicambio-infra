# Passo 9: a API do Orders (equivalente ao serviço orders-api do docker-compose.yml).
# Mesmo padrão do rates-api.yaml, com uma diferença: o Orders chama o Rates e o Payments pelos nomes dos Services
# deles (rates-api e payments-api). O Service "orders-api" é o endereço que o web (nginx) vai usar.
# Passo 11: a senha do banco vem do Secret "orders-db" e entra na connection string via $(DB_PASSWORD).
# Ainda provisório: a imagem só existe no Docker local (imagePullPolicy: Never).
# Passo 13: probes de readiness (/health/ready) e liveness (/health/live), como no rates-api.yaml.
# Passo 14: 3 réplicas, como no rates-api.yaml. O worker roda em cada Pod e o SELECT ... FOR UPDATE SKIP LOCKED
# impede que dois Pods processem o mesmo registro.
# Passo 15.3: NetworkPolicy "orders-api" (a rede frontend do compose): só o web entra na porta 8080.
# Passo 16.5: migrations fora da API (Database__ApplyMigrationsOnStartup=false), no Job orders-migrations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: minicambio
spec:
  replicas: 3 # o worker roda nas 3; o SKIP LOCKED divide os registros entre elas
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: api
          image: minicambio-orders-api:latest
          imagePullPolicy: Never # usa só a imagem do Docker local; nunca tenta baixar de um registry
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development # igual ao compose: habilita a documentação em /scalar
            - name: Database__ApplyMigrationsOnStartup # quem migra é o Job orders-migrations; o "false" explícito
              value: "false" # vence o "true" do appsettings.Development.json, que o Development acima carrega
            - name: DB_PASSWORD # tem que vir antes da connection string, que a usa via $(DB_PASSWORD)
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: password
            - name: ConnectionStrings__Default # Host = nome do Service do banco
              value: Host=orders-db;Port=5432;Database=orders;Username=orders;Password=$(DB_PASSWORD)
            - name: Services__RatesApi
              value: http://rates-api:8080 # nome do Service do Rates
            - name: Services__PaymentsApi
              value: http://payments-api:8080 # nome do Service do Payments
          ports:
            - containerPort: 8080
          readinessProbe: # mesmas probes do rates-api.yaml; o /health/ready do Orders só checa o próprio banco
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: minicambio
spec:
  selector:
    app: orders-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-api
  namespace: minicambio
spec:
  podSelector: # a quem a regra se aplica: aos Pods desta API
    matchLabels:
      app: orders-api
  policyTypes:
    - Ingress # só o que ENTRA; a saída continua livre (a API ainda alcança o próprio banco e o DNS)
  ingress:
    - from:
        - podSelector: # só o nginx do web chama o Orders (o /api do navegador)
            matchLabels:
              app: web
      ports:
        - port: 8080
