# Passo 27.10.1: configuração do Alertmanager (vira o ConfigMap "alertmanager-config", gerado pelo kustomization.yaml).
# O Prometheus decide QUE um alerta disparou (regras do alertas.yml); o Alertmanager decide O QUE FAZER com ele:
# - route: a árvore de roteamento. Todo alerta entra pela raiz; "routes" filhas (ainda não usadas) mandariam, por
#   exemplo, severity=critica para um canal e severity=aviso para outro.
# - group_by: alertas com os mesmos valores nestas etiquetas viram UMA notificação. Ex.: se o Orders do DEV der
#   5xx em 3 Pods, sai um aviso só, não três.
# - receivers: os destinos (e-mail, Slack, webhook...). Por enquanto um destino vazio: o alerta só aparece na
#   tela do Alertmanager, sem mandar nada para fora.
route:
  receiver: so-na-tela
  group_by: [alertname, namespace, app]
  group_wait: 30s # espera antes da 1ª notificação de um grupo novo, para juntar alertas que chegam quase juntos
  group_interval: 5m # um alerta novo num grupo que já avisou espera isso para entrar na próxima notificação
  repeat_interval: 4h # alerta que continua disparado é lembrado a cada 4 h (e não a cada avaliação)

receivers:
  - name: so-na-tela # sem e-mail, Slack nem webhook: nada sai daqui (um destino real fica para o 27.10.3)
