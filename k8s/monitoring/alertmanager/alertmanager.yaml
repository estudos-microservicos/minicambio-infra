# Passo 27.10.1: o Alertmanager (Deployment + Service + Ingress), no namespace monitoring.
# - Recebe os alertas disparados pelo Prometheus, agrupa, tira repetidos, respeita silêncios e manda para os
#   destinos do alertmanager.yml (ConfigMap gerado, com hash no nome, como o do Prometheus).
# - Equivalente no compose: um serviço "alertmanager" com a imagem prom/alertmanager e o alertmanager.yml montado
#   como volume.
# - Sem PVC: o disco dele guarda só os silêncios e o registro do que já foi notificado. Num emptyDir isso se perde
#   quando o Pod é recriado (um silêncio criado na tela some). Em produção iria um PVC, ou 3 réplicas em cluster.
# - Sem autenticação: qualquer um que alcance o alertmanager.localhost pode criar silêncios. Só para estudo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.2
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            # Com várias réplicas, os Alertmanagers conversam entre si (porta 9094) para não notificar em dobro.
            # Com uma só, o endereço vazio desliga essa conversa (e o aviso de "cluster" no log).
            - --cluster.listen-address=
          ports:
            - containerPort: 9093
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config # o Kustomize acrescenta o hash
        - name: data
          emptyDir: {} # pasta vazia que vive enquanto o Pod viver
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: alertmanager.localhost # o navegador resolve *.localhost sozinho
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093
