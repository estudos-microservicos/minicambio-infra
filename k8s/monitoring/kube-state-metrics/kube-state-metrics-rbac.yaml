# Passo 31.1: permissões do kube-state-metrics, no mesmo esquema do Prometheus (Passo 27.1):
# ServiceAccount (crachá) + ClusterRole (cargo) + ClusterRoleBinding (nomeação).
# - O kube-state-metrics lê os OBJETOS na API do Kubernetes (o que está escrito no spec e no status de cada um) e
#   transforma em métricas. Não mede CPU nem memória (isso é o cAdvisor/metrics-server).
# - Só leitura (list/watch) e só dos tipos ligados no "--resources" do Deployment. O manifest oficial dá leitura de
#   quase tudo, inclusive Secrets; aqui fica o mínimo para os alertas deste passo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods", "resourcequotas"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
