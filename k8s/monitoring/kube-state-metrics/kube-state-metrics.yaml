# Passo 31.1: kube-state-metrics (Deployment + Service), escrito à mão a partir do examples/standard oficial (v2.20.0).
# - Fecha a lacuna do Passo 27.9: o "up == 0" não vê um Deployment com 0 réplicas (sem Pod não há alvo). Aqui o
#   estado vem do objeto: kube_deployment_status_replicas_available, kube_resourcequota (used x hard), Pods
#   Pending, reinícios de container, HPAs, Jobs...
# - Equivalente no compose: não há (o compose não tem objetos com estado desejado para comparar).
# - Versão: a tabela de compatibilidade liga a v2.20.0 ao Kubernetes 1.36 (o do Docker Desktop).
# - Sem estado e sem disco: ele monta tudo na memória a partir da API, a cada subida.
# - Diferenças do oficial: namespace monitoring (o oficial usa kube-system) e "--resources" só com os tipos usados.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            # Só estes tipos viram métricas (e só estes estão no ClusterRole). Sem a opção, ele tentaria ler ~30 tipos
            # e encheria o log de "forbidden".
            - --resources=deployments,pods,resourcequotas,horizontalpodautoscalers,jobs
          ports:
            - name: http-metrics # as métricas dos objetos, em /metrics
              containerPort: 8080
            - name: telemetry # as métricas do próprio kube-state-metrics e o /readyz
              containerPort: 8081
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi # cresce com o número de objetos no cluster
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 5
          securityContext: # igual ao oficial: sem root, sem escrita no disco, sem privilégios extras
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
