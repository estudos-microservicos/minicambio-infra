# Passo 27.4: fontes de dados do Grafana, por arquivo ("provisioning"), em vez de cadastrar clicando na tela.
# Vira o ConfigMap "grafana-datasources" (gerado pelo kustomization.yaml), montado na pasta que o Grafana lê ao
# subir: /etc/grafana/provisioning/datasources. Se o volume for apagado, a fonte volta sozinha na próxima subida.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus # fixo, para os dashboards por arquivo (próximos passos) apontarem para ele
    type: prometheus
    access: proxy # quem consulta o Prometheus é o servidor do Grafana, não o navegador
    url: http://prometheus:9090 # o Service do Passo 27.2; mesmo namespace, então basta o nome
    isDefault: true
    editable: false # na tela fica só leitura: quem manda é este arquivo
