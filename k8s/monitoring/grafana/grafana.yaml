# Passo 27.4: Grafana (Deployment + Service + PVC + Ingress), a tela de gráficos em cima do Prometheus.
# - Equivalente no compose: um serviço "grafana" com a imagem grafana/grafana, a pasta provisioning/ montada como
#   volume, um volume nomeado para /var/lib/grafana e a porta 3000 publicada no host.
# - O Grafana não guarda métricas: ele só consulta o Prometheus (fonte de dados em datasources.yaml, ao lado).
#   O que ele guarda no PVC (banco SQLite em /var/lib/grafana) são usuários, preferências e dashboards criados
#   pela tela. Por isso o "Recreate", como nos bancos: dois Pods não podem abrir o mesmo SQLite.
# - Senha do admin: vem do Secret "grafana" (secretGenerator, arquivo secrets/grafana.env). Como no Postgres, ela
#   só vale na PRIMEIRA subida, quando o banco é criado; depois fica gravada no PVC e trocar o Secret não muda
#   nada (seria preciso trocar pela tela ou com "grafana cli admin reset-admin-password").
# - Dashboards (Passo 27.7): também por arquivo. O dashboards.yaml diz onde procurar, e os .json de
#   grafana/dashboards/ viram o ConfigMap "grafana-dashboards". Para mudar um dashboard: editar o .json e aplicar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.3.0
          ports:
            - containerPort: 3000
          env:
            # O Grafana lê qualquer configuração do grafana.ini como GF_<SECAO>_<CHAVE>.
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana # o Kustomize acrescenta o hash aqui também
                  key: password
            - name: GF_SERVER_ROOT_URL
              value: http://grafana.localhost/ # endereço público, usado nos links e redirecionamentos
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health # responde 200 quando o servidor e o banco SQLite estão de pé
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider # Passo 27.7: onde procurar dashboards (dashboards.yaml)
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards # Passo 27.7: os dashboards em si (grafana/dashboards/*.json)
              mountPath: /etc/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Mesmo esquema do Skooner: o Ingress fica no namespace do Service (só enxerga Services do próprio namespace),
# e o controlador ingress-nginx, que é um só para o cluster, junta as regras de todos os namespaces.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.localhost # o navegador resolve *.localhost sozinho (o PowerShell 5.1 não; ver Passo 18)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
