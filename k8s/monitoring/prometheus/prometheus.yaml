# Passo 27.2: o Prometheus em si (Deployment + Service + PVC), no padrão dos bancos.
# - Equivalente no compose: um serviço "prometheus" com a imagem prom/prometheus, o prometheus.yml montado como
#   volume e um volume nomeado para os dados. Aqui o arquivo vem de um ConfigMap (gerado pelo kustomization.yaml a
#   partir do prometheus.yml ao lado, com hash no nome: mudar o arquivo muda o hash e recria o Pod sozinho).
# - Ele é um banco de dados de séries temporais: guarda no disco cada valor coletado, com data e hora. Por isso o
#   PVC e o "Recreate" (dois Pods não podem escrever no mesmo diretório de dados), como nos bancos.
# - Usa a ServiceAccount "prometheus" do Passo 27.1, que permite perguntar à API do Kubernetes pelos alvos.
# - Provisório: sem Ingress (acesso por port-forward) e sem NetworkPolicy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus # sem isto o Pod usaria a conta "default", sem permissão nenhuma
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d # apaga o que tiver mais de 7 dias
            - --storage.tsdb.retention.size=800MB # ou quando passar disso (o PVC tem 1Gi)
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi # a memória cresce com o número de séries coletadas
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus # o ConfigMap vira uma pasta com o arquivo prometheus.yml dentro
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config # o Kustomize acrescenta o hash aqui também
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
