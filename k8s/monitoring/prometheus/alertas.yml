# Passo 27.9: regras de alerta do Prometheus. Vai no mesmo ConfigMap do prometheus.yml (prometheus-config) e é
# lido pelo "rule_files" de lá. A cada evaluation_interval (15 s) o Prometheus roda cada "expr":
# - a consulta não devolve nada        → alerta inativo (inactive);
# - devolve linhas, mas há menos tempo que o "for" → pendente (pending), para não alarmar por um soluço;
# - devolve linhas há mais tempo que o "for"       → disparado (firing). Uma linha = um alerta (por namespace/app).
# Por enquanto o alerta só aparece na tela (Alerts). Mandar e-mail, Slack etc. é papel do Alertmanager (27.10).
# Passo 31.3: + grupo "minicambio-objetos" (réplicas e cotas, pelo kube-state-metrics).
groups:
  - name: minicambio-apis
    rules:
      # Alvo descoberto, mas a coleta falha (Pod travado, /metrics quebrado, kubelet sem resposta).
      # Limite: um Deployment com 0 réplicas NÃO dispara isto, porque sem Pod não há alvo e, sem alvo, não há
      # série "up" nenhuma (nem com 0). Ver o estado dos objetos (réplicas desejadas x prontas) é o papel do
      # kube-state-metrics.
      - alert: AlvoForaDoAr
        expr: up == 0
        for: 1m
        labels:
          severity: critica
        annotations:
          summary: "Coleta falhando: {{ $labels.job }} em {{ $labels.instance }}"
          description: "O Prometheus não consegue ler as métricas deste alvo há mais de 1 minuto."

      # Mais de 5% das respostas de uma API são 5xx (falha do servidor), na média dos últimos 2 minutos.
      # Divide "respostas 5xx por segundo" por "todas as respostas por segundo", por namespace e app.
      - alert: ApiComMuitosErros5xx
        expr: |
          sum by (namespace, app) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5..", http_route!~"/health/.*|/metrics"}[2m]))
            /
          sum by (namespace, app) (rate(http_server_request_duration_seconds_count{http_route!~"/health/.*|/metrics"}[2m]))
            > 0.05
        for: 1m
        labels:
          severity: critica
        annotations:
          summary: "{{ $labels.app }} ({{ $labels.namespace }}) com {{ $value | humanizePercentage }} de respostas 5xx"
          description: "Mais de 5% das respostas são erro do servidor há mais de 1 minuto."

      # 95% das requisições levam mais de 1 s, por 5 minutos seguidos.
      - alert: ApiLenta
        expr: |
          histogram_quantile(0.95, sum by (namespace, app, le) (rate(http_server_request_duration_seconds_bucket{http_route!~"/health/.*|/metrics"}[5m])))
            > 1
        for: 5m
        labels:
          severity: aviso
        annotations:
          summary: "{{ $labels.app }} ({{ $labels.namespace }}) lenta: p95 de {{ $value | humanizeDuration }}"
          description: "O percentil 95 da duração das requisições passou de 1 s há mais de 5 minutos."

  # Passo 31.3: regras sobre o ESTADO dos objetos, lido do kube-state-metrics (Passo 31.1). Diferente das de cima,
  # não dependem de o Pod existir: o Deployment e a ResourceQuota continuam lá mesmo sem Pod nenhum.
  - name: minicambio-objetos
    rules:
      # Fecha a lacuna do AlvoForaDoAr: Deployment com 0 Pods prontos (0 réplicas, Pods em CrashLoop, readiness
      # falhando, Pods Pending por falta de cota ou de CPU...). Só as 3 APIs e o web, nos dois ambientes.
      # O "app" vem do nome do Deployment, para o Alertmanager agrupar igual às regras de cima (group_by ... app).
      - alert: ApiSemPodsProntos
        expr: |
          kube_deployment_status_replicas_available{namespace=~"minicambio|minicambio-dev", deployment=~".+-api|web"} == 0
        for: 1m
        labels:
          severity: critica
          app: "{{ $labels.deployment }}"
        annotations:
          summary: "{{ $labels.deployment }} ({{ $labels.namespace }}) sem nenhum Pod pronto"
          description: "O Deployment está com 0 Pods disponíveis há mais de 1 minuto: ninguém atende essa API."

      # Algum item de uma ResourceQuota (Passos 28 e 29) passou de 80% do teto. Acima do teto, Pods novos são
      # recusados (FailedCreate) e o HPA ou o rollout param sem barulho: o aviso vem antes.
      # used / hard: as duas séries só diferem na etiqueta "type"; o "ignoring(type)" casa uma com a outra pelo
      # resto (namespace, resourcequota, resource). Uma linha por item: pods, requests.cpu, limits.memory...
      - alert: CotaPertoDoTeto
        expr: |
          kube_resourcequota{type="used"}
            / ignoring(type)
          kube_resourcequota{type="hard"}
            > 0.8
        for: 2m
        labels:
          severity: aviso
        annotations:
          summary: "Cota {{ $labels.resourcequota }} ({{ $labels.namespace }}): {{ $labels.resource }} em {{ $value | humanizePercentage }}"
          description: "Este item da ResourceQuota passou de 80% do teto há mais de 2 minutos. No teto, Pods novos são recusados."
