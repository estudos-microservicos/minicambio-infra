# Passo 27: monitoramento (Prometheus e Grafana), escrito à mão, sem Helm nem Operator.
# Fica fora dos overlays: um monitoramento só, para o cluster todo. Aplicar com:
#   kubectl apply -k k8s/monitoring
# Antes da primeira vez: copiar secrets/grafana.env.example para secrets/grafana.env e trocar a senha
# (o grafana.env fica fora do git, como os secrets/*.env dos overlays).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - prometheus/prometheus-rbac.yaml
  - prometheus/prometheus.yaml
  - grafana/grafana.yaml
  - alertmanager/alertmanager.yaml # Passo 27.10.1

configMapGenerator:
  - name: alertmanager-config # Passo 27.10.1
    namespace: monitoring
    files:
      - alertmanager/alertmanager.yml
  # Mesmo esquema do redis.conf (Passo 26): o arquivo vira uma chave do ConfigMap, com o mesmo nome.
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus/prometheus.yml
      - prometheus/alertas.yml # Passo 27.9: segunda chave do mesmo ConfigMap = segundo arquivo na pasta
  - name: grafana-datasources
    namespace: monitoring
    files:
      - grafana/datasources.yaml
  # Passo 27.7: dashboards por arquivo. Cada .json vira uma chave; um ConfigMap aguenta até 1 MiB no total.
  - name: grafana-dashboard-provider
    namespace: monitoring
    files:
      - grafana/dashboards.yaml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - grafana/dashboards/minicambio-apis.json

secretGenerator:
  # Mesmo esquema do Passo 26.9: cada linha "chave=valor" do arquivo vira uma chave do Secret.
  - name: grafana
    namespace: monitoring
    envs:
      - secrets/grafana.env
