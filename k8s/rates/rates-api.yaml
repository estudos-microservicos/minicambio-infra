# Passo 7: a API do Rates (equivalente ao serviço rates-api do docker-compose.yml).
# - Deployment: roda a imagem minicambio-rates-api que o "docker compose build" já gerou no Docker local.
# - Service: dá à API o endereço fixo "rates-api", que o Orders vai usar (Services__RatesApi=http://rates-api:8080).
# - Secret (Passo 11): a senha do banco vem do Secret "rates-db" e entra na connection string via $(DB_PASSWORD).
# Ainda provisório: a imagem só existe no Docker local (imagePullPolicy: Never).
# - Probes (Passo 13): readiness em /health/ready e liveness em /health/live (o healthcheck do compose).
# - Réplicas (Passo 14): 3 Pods atrás do mesmo Service.
# - Migrations (Passo 16.4): saíram da API (Database__ApplyMigrationsOnStartup=false) e rodam no Job
#   rates-migrations, que precisa terminar antes de a API subir com uma versão nova do banco.
# - NetworkPolicy (Passo 15.3): a rede backend do compose; só o orders-api entra na porta 8080.
#   Passo 18.3: o controlador do Ingress (namespace ingress-nginx) também entra, para o rates.localhost.
# - ConfigMap (Passo 20): a configuração não sigilosa saiu do "env" para o ConfigMap "rates-api" (fim do arquivo),
#   lido via envFrom. No "env" ficam só a senha (Secret) e a connection string, que depende dela.
# - Cache (Passo 22): a taxa ao vivo fica 5 min no Redis rates-cache (rates-cache.yaml), compartilhado pelos 3 Pods.
#   Senha do Secret "rates-cache" em REDIS_PASSWORD, dentro da ConnectionStrings__Redis. O Redis não entra na
#   readiness: fora do ar, a API segue respondendo sem cache.
# - Autoscaling (Passo 23.4): o número de Pods saiu do Deployment (sem "replicas") e passou para o
#   HorizontalPodAutoscaler "rates-api" (fim do arquivo): de 1 a 3 Pods, conforme a CPU. Exige o metrics-server.
# - PodDisruptionBudget (Passo 24.2): pelo menos 1 Pod do Rates de pé durante um "kubectl drain" (fim do arquivo).
#   Passo 24.4: o HPA passou a manter no mínimo 2 Pods; com 1, o drain nunca terminaria.
# - behavior do HPA (Passo 25.2): desce depois de 1 min de carga baixa, e não dos 5 min do padrão.
#   Passo 25.4: sobe de 1 em 1 Pod a cada 30 s, e o teto passou de 3 para 5 Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rates-api
  namespace: minicambio
spec:
  # sem "replicas": quem decide quantos Pods rodam é o HPA (fim do arquivo); com o campo aqui, cada
  # "kubectl apply" voltaria a quantidade para o valor fixo e brigaria com o HPA
  selector:
    matchLabels:
      app: rates-api
  template:
    metadata:
      labels:
        app: rates-api
    spec:
      containers:
        - name: api
          image: minicambio-rates-api:latest
          imagePullPolicy: Never # usa só a imagem do Docker local; nunca tenta baixar de um registry
          envFrom: # cada chave do ConfigMap vira uma variável de ambiente com o mesmo nome
            - configMapRef:
                name: rates-api
          env: # se uma variável aparecer aqui e no ConfigMap, vale a daqui
            - name: DB_PASSWORD # tem que vir antes: $(...) só enxerga variáveis declaradas acima dela
              valueFrom:
                secretKeyRef:
                  name: rates-db
                  key: password
            - name: ConnectionStrings__Default # Host = nome do Service do banco; $(DB_PASSWORD) é trocado pelo valor acima
              value: Host=rates-db;Port=5432;Database=rates;Username=rates;Password=$(DB_PASSWORD)
            - name: REDIS_PASSWORD # Passo 22: mesmo esquema do banco, com o Secret do Redis
              valueFrom:
                secretKeyRef:
                  name: rates-cache
                  key: password
            - name: ConnectionStrings__Redis # Host = nome do Service do Redis
              value: rates-cache:6379,password=$(REDIS_PASSWORD)
          ports:
            - containerPort: 8080
          readinessProbe: # "posso receber requisições?"; se falhar, o Service tira o Pod da lista, sem reiniciar
            httpGet: # quem faz a requisição é o kubelet, de fora do container
              path: /health/ready # inclui o banco: sem banco, a API sai da lista do Service
              port: 8080
            periodSeconds: 5 # testa a cada 5 s
            failureThreshold: 3 # 3 falhas seguidas = não pronto
          livenessProbe: # "estou vivo?"; se falhar, o kubelet reinicia o container
            httpGet:
              path: /health/live # não depende do banco: banco fora do ar não é motivo para reiniciar a API
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rates-api
  namespace: minicambio
spec:
  selector:
    app: rates-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rates-api
  namespace: minicambio
spec:
  podSelector: # a quem a regra se aplica: aos Pods desta API
    matchLabels:
      app: rates-api
  policyTypes:
    - Ingress # só o que ENTRA; a saída continua livre (a API ainda alcança o próprio banco e o DNS)
  ingress:
    - from:
        - podSelector: # só o Orders chama o Rates (cotação ao criar a ordem)
            matchLabels:
              app: orders-api
        - namespaceSelector: # Passo 18.3: o controlador do Ingress, que mora em OUTRO namespace
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx # label que todo namespace recebe sozinho
          podSelector: # SEM hífen: mesmo item do namespaceSelector, então vale "E" (só o controlador de lá)
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - port: 8080
---
apiVersion: v1
kind: ConfigMap # o "environment:" do compose, fora do Deployment; o Pod só lê os valores ao subir
metadata:
  name: rates-api
  namespace: minicambio
data: # só texto: todo valor é string, por isso o "false" vai entre aspas
  ASPNETCORE_ENVIRONMENT: Development # igual ao compose: habilita a documentação em /scalar
  # quem migra é o Job rates-migrations; o "false" explícito vence o "true" do appsettings.Development.json
  Database__ApplyMigrationsOnStartup: "false"
  Rates__LiveRateCacheSeconds: "300" # Passo 22: 5 min de cache da taxa ao vivo (o padrão da API, aqui explícito)
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler # sem equivalente no compose: lá o "deploy.replicas" é sempre fixo
metadata:
  name: rates-api
  namespace: minicambio
spec:
  scaleTargetRef: # o que ele escala: o HPA só muda o "replicas" deste Deployment, como um "kubectl scale"
    apiVersion: apps/v1
    kind: Deployment
    name: rates-api
  minReplicas: 2 # Passo 24.4: parado, fica com 2 Pods (com 1, o PDB travaria qualquer "kubectl drain")
  # Passo 25.4: era 3; o Rates não lê Kafka, então não tem o teto das 3 partições. Com 2 a 5, sobram 3 degraus
  # para o scaleUp abaixo subir de um em um
  maxReplicas: 5 # nunca passa de 5, por mais carga que chegue
  metrics:
    - type: Resource # CPU medida pelo metrics-server
      resource:
        name: cpu
        target:
          type: Utilization # porcentagem do requests.cpu do container (100m), não da máquina
          averageUtilization: 50 # alvo: média de 50m por Pod; acima disso ele cria Pods, abaixo ele remove
  behavior: # Passo 25.2: a VELOCIDADE com que o HPA chega ao número de Pods (sem o campo, valem os padrões)
    scaleDown: # a regra de descer
      stabilizationWindowSeconds: 60 # padrão: 300; só remove Pod se a carga ficou baixa no último 1 min
    scaleUp: # Passo 25.4: a regra de subir; sem ela, sobe até 4 Pods ou o dobro a cada 15 s
      policies:
        - type: Pods # limite em número de Pods (a outra opção é Percent, em % dos Pods atuais)
          value: 1 # no máximo 1 Pod novo...
          periodSeconds: 30 # ...a cada 30 s: de 2 para 5 leva pelo menos 1 min e meio
---
apiVersion: policy/v1
kind: PodDisruptionBudget # sem equivalente no compose: lá não existem nós nem manutenção de nó
metadata:
  name: rates-api
  namespace: minicambio
spec:
  selector: # quais Pods a regra protege: os mesmos que o Service e o Deployment enxergam
    matchLabels:
      app: rates-api
  minAvailable: 1 # durante um "drain", nunca deixar menos de 1 Pod do Rates pronto (readiness ok)
